<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#faf8ff" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/learnhub-logo.svg" />
  <meta name="description" content="Explore expert-led LearnHub courses in development, design, programming, and data science." />
  <title>Explore Courses — LearnHub</title>
    <script>
    (() => {
      const root = document.documentElement;
      let savedTheme = null;
      try {
        savedTheme = localStorage.getItem('theme');
      } catch {
        // Use the system preference when browser storage is unavailable.
      }
      const isDark = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      root.classList.toggle('dark', isDark);
      root.style.colorScheme = isDark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', isDark ? '#0b0f19' : '#faf8ff');
    })();
  </script><link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="/css/output.css" />
</head>

<body data-page="courses" class="min-h-screen overflow-x-hidden bg-surface font-sans text-on-surface antialiased selection:bg-primary-fixed selection:text-primary dark:bg-[#0b0f19] dark:text-slate-100">
  <site-header></site-header>

  <main class="flex-1 pt-20">
    <!-- Page introduction and course count -->
    <section class="relative overflow-hidden bg-linear-to-b from-surface-container-low via-surface to-surface py-10 dark:from-slate-900/60 dark:via-[#0b0f19] dark:to-[#0b0f19] sm:py-14 lg:py-16">
      <div class="pointer-events-none absolute -top-24 right-10 h-96 w-96 rounded-full bg-primary/10 blur-3xl dark:bg-primary/15"></div>
      <div class="pointer-events-none absolute -bottom-20 left-1/4 h-80 w-80 rounded-full bg-secondary/10 blur-2xl"></div>
      <div class="relative z-10 mx-auto flex max-w-7xl flex-col gap-6 px-4 sm:px-6 lg:flex-row lg:items-end lg:justify-between lg:px-8">
        <div class="flex max-w-3xl flex-col gap-3">
          <span class="inline-flex w-fit items-center gap-2 rounded-full bg-primary/10 px-3.5 py-1.5 text-primary dark:bg-primary/20 dark:text-blue-300">
            <span class="material-symbols-outlined text-base" aria-hidden="true">school</span>
            <span class="text-label-sm font-semibold uppercase tracking-wider">Curated knowledge catalog</span>
          </span>
          <h1 class="text-4xl font-bold tracking-tight text-on-surface dark:text-white sm:text-5xl">Explore courses</h1>
          <p class="max-w-2xl text-base leading-relaxed text-on-surface-variant dark:text-slate-300 sm:text-lg">
            Find practical, expert-led courses to build skills and move your goals forward.
          </p>
        </div>
        <div class="flex items-center gap-3 rounded-2xl border border-outline-variant/50 bg-surface-container-lowest/80 px-4 py-3 shadow-sm dark:border-slate-700 dark:bg-slate-900/70">
          <span class="material-symbols-outlined text-2xl text-primary" aria-hidden="true">auto_stories</span>
          <div>
            <p class="text-label-sm font-semibold uppercase tracking-wide text-on-surface-variant dark:text-slate-400">Course catalog</p>
            <p id="course-count" class="font-semibold text-on-surface dark:text-white" aria-live="polite">Loading courses…</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Search, sort, level, and price controls -->
    <section class="bg-surface pb-8 pt-2 dark:bg-[#0b0f19]" aria-label="Find a course">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 gap-3 rounded-3xl border border-outline-variant/50 bg-surface-container-low p-4 dark:border-slate-800 dark:bg-slate-900/60 md:grid-cols-2 lg:grid-cols-4 lg:p-5">
          <label class="relative md:col-span-2 lg:col-span-1">
            <span class="sr-only">Search courses</span>
            <span class="material-symbols-outlined pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-xl text-outline" aria-hidden="true">search</span>
            <input id="course-search" type="search" autocomplete="off" placeholder="Search courses or instructors…" class="min-h-12 w-full rounded-2xl border border-transparent bg-surface-container-lowest py-3 pl-11 pr-4 text-body-md text-on-surface shadow-sm placeholder:text-outline focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-400" />
          </label>

          <label>
            <span class="sr-only">Sort courses</span>
            <select id="course-sort" class="min-h-12 w-full cursor-pointer rounded-2xl border border-transparent bg-surface-container-lowest px-3.5 py-3 text-label-lg text-on-surface shadow-sm focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 dark:bg-slate-800 dark:text-white">
              <option value="popular">Most popular</option>
              <option value="rating">Highest rated</option>
              <option value="newest">Newest releases</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
            </select>
          </label>

          <label>
            <span class="sr-only">Filter by level</span>
            <select id="course-level" class="min-h-12 w-full cursor-pointer rounded-2xl border border-transparent bg-surface-container-lowest px-3.5 py-3 text-label-lg text-on-surface shadow-sm focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 dark:bg-slate-800 dark:text-white">
              <option value="all">Level: all</option>
              <option value="Beginner">Beginner</option>
              <option value="Intermediate">Intermediate</option>
              <option value="Advanced">Advanced</option>
            </select>
          </label>

          <label>
            <span class="sr-only">Filter by price</span>
            <select id="course-price" class="min-h-12 w-full cursor-pointer rounded-2xl border border-transparent bg-surface-container-lowest px-3.5 py-3 text-label-lg text-on-surface shadow-sm focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 dark:bg-slate-800 dark:text-white">
              <option value="all">Pricing: all</option>
              <option value="paid">Paid courses</option>
              <option value="free">Free courses</option>
            </select>
          </label>
        </div>

        <!-- Category chips remain horizontally scrollable on narrow screens -->
        <div class="mt-5 flex gap-2 overflow-x-auto pb-2" role="group" aria-label="Filter by category">
          <button class="category-filter shrink-0 rounded-full bg-primary-container px-5 py-2.5 text-label-lg font-semibold text-white shadow-sm transition hover:opacity-90" type="button" data-category="all" aria-pressed="true">All courses</button>
          <button class="category-filter shrink-0 rounded-full bg-surface-container-lowest px-4 py-2.5 text-label-lg text-on-surface-variant shadow-sm transition hover:bg-surface-container dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700" type="button" data-category="Web Development" aria-pressed="false">Web development</button>
          <button class="category-filter shrink-0 rounded-full bg-surface-container-lowest px-4 py-2.5 text-label-lg text-on-surface-variant shadow-sm transition hover:bg-surface-container dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700" type="button" data-category="UI/UX Design" aria-pressed="false">UI/UX design</button>
          <button class="category-filter shrink-0 rounded-full bg-surface-container-lowest px-4 py-2.5 text-label-lg text-on-surface-variant shadow-sm transition hover:bg-surface-container dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700" type="button" data-category="Programming" aria-pressed="false">Programming</button>
          <button class="category-filter shrink-0 rounded-full bg-surface-container-lowest px-4 py-2.5 text-label-lg text-on-surface-variant shadow-sm transition hover:bg-surface-container dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700" type="button" data-category="Data Science" aria-pressed="false">Data science</button>
          <button class="category-filter shrink-0 rounded-full bg-surface-container-lowest px-4 py-2.5 text-label-lg text-on-surface-variant shadow-sm transition hover:bg-surface-container dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700" type="button" data-category="Marketing" aria-pressed="false">Marketing</button>
        </div>
      </div>
    </section>

    <!-- Results are rendered from the course catalog in js/pages/courses.js -->
    <section class="bg-surface pb-16 dark:bg-[#0b0f19]" aria-labelledby="results-heading">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
          <h2 id="results-heading" class="text-headline-sm font-bold text-on-surface dark:text-white">Discover your next skill</h2>
          <button id="reset-course-filters" class="hidden rounded-xl px-3 py-2 text-label-lg font-semibold text-primary hover:bg-primary/10 focus-visible:outline-primary" type="button">Clear filters</button>
        </div>

        <div id="course-grid" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3" aria-live="polite" aria-busy="true"></div>

        <div id="course-empty-state" class="hidden rounded-3xl border border-outline-variant/50 bg-surface-container-low p-10 text-center dark:border-slate-800 dark:bg-slate-900/60">
          <span class="material-symbols-outlined mx-auto mb-3 text-5xl text-outline" aria-hidden="true">manage_search</span>
          <h3 class="mb-2 text-headline-sm font-bold text-on-surface dark:text-white">No matching courses found</h3>
          <p class="mb-5 text-body-md text-on-surface-variant dark:text-slate-400">Try another search or clear your filters.</p>
          <button class="rounded-xl bg-primary-container px-5 py-2.5 text-label-lg font-semibold text-white shadow-sm transition hover:bg-primary" type="button" data-clear-filters>Clear filters</button>
        </div>

        <nav id="course-pagination" class="mt-8 flex items-center justify-center gap-2" aria-label="Course pages"></nav>
      </div>
    </section>
  </main>

  <site-footer></site-footer>
  <script type="module" src="/js/main.js"></script>
</body>

</html>
